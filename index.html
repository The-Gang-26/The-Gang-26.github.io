<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Gang</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="loading-screen" class="screen">
    <div class="spinner"></div>
  </div>

  <div id="login-screen" class="screen hidden">
    <div class="card">
      <h1>The Gang</h1>
      <p class="subtitle">Members only.</p>

      <form id="email-form" novalidate>
        <input id="email" type="email" placeholder="Email" autocomplete="email" required />
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" required minlength="6" />
        <button type="submit" id="email-submit" class="btn btn-primary">Sign in</button>
      </form>

      <div class="login-links">
        <a href="#" id="toggle-mode">Create an account</a>
        <a href="#" id="forgot-password">Forgot password?</a>
      </div>

      <p id="login-error" class="error hidden"></p>
    </div>
  </div>

  <div id="recovery-screen" class="screen hidden">
    <div class="card">
      <h1>Set a new password</h1>
      <p class="subtitle">Choose a new password for your account.</p>
      <form id="recovery-form">
        <input id="new-password" type="password" placeholder="New password"
               autocomplete="new-password" minlength="6" required />
        <button type="submit" class="btn btn-primary">Update password</button>
      </form>
      <p id="recovery-error" class="error hidden"></p>
    </div>
  </div>

  <div id="gate-screen" class="screen hidden">
    <div class="card">
      <h1>Almost in</h1>
      <p class="subtitle">Enter the group code.</p>
      <form id="gate-form">
        <input id="gate-code" type="password" placeholder="Group code"
               autocomplete="off" autocapitalize="off" spellcheck="false" required />
        <button type="submit" class="btn btn-primary">Unlock</button>
      </form>
      <p id="gate-error" class="error hidden"></p>
      <button id="signout-gate" class="btn btn-ghost">Sign out</button>
    </div>
  </div>

  <div id="app-screen" class="screen hidden">
    <header>
      <h1>The Gang</h1>
      <div class="user">
        <img id="user-photo" alt="" />
        <span id="user-name"></span>
        <button id="signout" class="btn btn-ghost">Sign out</button>
      </div>
    </header>

    <main>
      <section class="composer">
        <textarea id="post-text" placeholder="Say something to the gang…" maxlength="2000"></textarea>

        <div id="media-preview" class="media-preview hidden">
          <div id="media-preview-content"></div>
          <button type="button" id="media-remove" class="media-remove" aria-label="Remove">×</button>
        </div>

        <div class="composer-actions">
          <button type="button" id="attach-btn" class="btn">📎 Attach</button>
          <input type="file" id="file-input" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm" hidden />
          <button id="post-btn" class="btn btn-primary">Post</button>
        </div>
      </section>

      <section id="feed"></section>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
